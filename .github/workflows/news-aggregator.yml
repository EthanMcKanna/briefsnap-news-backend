name: News Aggregator Processing

on:
  schedule:
    # Run at 7:00 AM Central Time (13:00 UTC)
    - cron: '0 13 * * *'
    # Run at 12:00 PM Central Time (18:00 UTC)
    - cron: '0 18 * * *'
    # Run at 5:00 PM Central Time (23:00 UTC)
    - cron: '0 23 * * *'
  workflow_dispatch:  # Allow manual triggering

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-news-aggregator:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create Firebase credentials file
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: |
          # Write to file using a Python script to ensure proper formatting
          python -c "import os, json; open('firebase-credentials.json', 'w').write(os.environ['FIREBASE_CREDENTIALS_JSON'])"
          
      - name: Run News Aggregator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          BRIEFSNAP_GEMINI_TIMEOUT_MS: "90000"
        run: python main.py

      - name: Verify published daily brief
        if: success()
        run: python verify_daily_brief_release.py
        
      - name: Upload data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: news-data
          path: data/daily_briefs/ 
